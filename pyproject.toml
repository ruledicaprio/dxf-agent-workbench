[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf-agent-workbench"
version = "0.1.0"
description = "Orthographic renderer for large DXF meshes"
readme = "README.md"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "trimesh>=3.23.0",
    "ezdxf>=1.1.0",
    "opencv-python>=4.5.0",
]

[project.scripts]
dxf-ortho = "dxf_agent.export.orthographic:main"
